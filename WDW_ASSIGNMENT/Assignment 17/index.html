<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Assignment 17 - Validation</title></head>
<body><h1>Validated Student Form</h1>
<form action="submit.php" method="post">
<label for="name">Name:</label><input id="name" name="name" type="text" required><br><br>
<label for="email">Email:</label><input id="email" name="email" type="email" required><br><br>
<label for="mobile">Mobile (10 digits):</label><input id="mobile" name="mobile" type="text" pattern="[0-9]{10}" title="Enter exactly 10 digits" required><br><br>
<label for="password">Password (minimum 8 characters):</label><input id="password" name="password" type="password" minlength="8" required><br><br>
<label for="age">Age (18-30):</label><input id="age" name="age" type="number" min="18" max="30" required><br><br>
<button type="submit">Submit</button></form>
<p>Form submission requires a server-side submit.php file.</p></body></html>
