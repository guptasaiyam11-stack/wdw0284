<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Assignment 15 - Form</title></head>
<body><h1>Student Information Form</h1><form>
<fieldset><legend>Personal Details</legend>
<label for="name">Full Name:</label><input id="name" name="name" type="text"><br><br>
<label for="email">Email:</label><input id="email" name="email" type="email"><br><br>
<label for="dob">Date of Birth:</label><input id="dob" name="dob" type="date"><br><br>
<label for="gender">Gender:</label><input id="gender" name="gender" type="radio" value="male">Male <input name="gender" type="radio" value="female">Female<br><br>
<label for="photo">Upload Photo:</label><input id="photo" name="photo" type="file"></fieldset><br>
<button type="submit">Submit</button></form></body></html>
