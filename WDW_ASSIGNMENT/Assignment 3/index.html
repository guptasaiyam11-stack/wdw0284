    <h1>Block and Inline Elements</h1>
    <div>This is a block element (div).</div>
    <p>This is another block element (paragraph).</p>
    <span>This is inline</span> <span>and this is also inline.</span>
    <p>Example: <strong>Bold</strong>, <em>Italic</em>, and <a href="#">Link</a> are inline elements.</p>
